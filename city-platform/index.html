<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>城市部件数据管理平台</title>
<link rel="stylesheet" href="libs/leaflet.css"/>
<link rel="stylesheet" href="libs/font-awesome.css"/>
<style>
:root{--bg-dark:#080e1a;--bg-panel:#0d1a2d;--bg-card:#111d33;--border:#1a2d4a;--accent:#2d6aa0;--accent2:#4a90d9;--text:#c8d6e5;--text-dim:#6b7d99;--green:#00c853;--red:#ff5252;--orange:#ff9100;--blue:#448aff;--gray:#546e7a;--glow:0 0 20px rgba(45,106,160,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg-dark);color:var(--text);overflow:hidden;height:100vh}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
#header{background:linear-gradient(90deg,#050d1a 0%,#0d1a2d 50%,#0a2540 100%);border-bottom:1px solid var(--accent);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:1000;box-shadow:0 2px 20px rgba(0,0,0,.5)}
#header h1{font-size:18px;font-weight:700;background:linear-gradient(90deg,#4a90d9,#7ec8e3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;display:flex;align-items:center;gap:8px}
#header h1::before{content:'';display:inline-block;width:3px;height:20px;background:var(--accent2);border-radius:2px;box-shadow:0 0 10px var(--accent2)}
#header-right{display:flex;align-items:center;gap:10px}
#header-right .user-name{font-size:12px;color:var(--text);font-weight:500}
#header-right .role-tag{font-size:10px;padding:1px 8px;border-radius:10px;background:rgba(74,144,217,.15);color:var(--accent2);border:1px solid rgba(74,144,217,.3)}
#result-count{font-size:12px;color:var(--text-dim);background:var(--bg-card);border:1px solid var(--border);padding:4px 12px;border-radius:4px}
.view-toggle{display:flex;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.view-btn{padding:5px 14px;font-size:12px;cursor:pointer;background:transparent;color:var(--text-dim);border:none;transition:all .2s;border-right:1px solid var(--border)}
.view-btn:last-child{border-right:none}
.view-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 12px rgba(45,106,160,.4)}
.view-btn:hover:not(.active){background:rgba(45,106,160,.15);color:var(--text)}
#btn-add{background:var(--accent);color:#fff;border:1px solid var(--accent2);padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;transition:all .2s}
#btn-add:hover{background:var(--accent2);box-shadow:var(--glow)}
.btn-secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;transition:all .2s}
.btn-secondary:hover{background:var(--bg-card);color:var(--text)}

/* Main */
#main{display:flex;flex:1;overflow:hidden}
#filter-panel{width:280px;background:var(--bg-panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
#filter-panel h3{padding:14px 16px;font-size:13px;color:var(--text-dim);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,.2)}
/* Search */
#search-box{padding:10px 12px;border-bottom:1px solid var(--border)}
#search-box input{width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text);outline:none;transition:all .2s}
#search-box input:focus{border-color:var(--accent2);box-shadow:0 0 8px rgba(74,144,217,.2)}
#search-box input::placeholder{color:var(--text-dim)}

/* Breadcrumb */
#breadcrumb{padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px;min-height:32px;border-bottom:1px solid rgba(26,45,74,.5)}
.bcrumb-tag{font-size:11px;padding:2px 8px;background:rgba(45,106,160,.2);border:1px solid rgba(45,106,160,.3);border-radius:3px;color:var(--accent2);display:flex;align-items:center;gap:4px;cursor:default}
.bcrumb-tag .rm{color:var(--text-dim);cursor:pointer;font-size:14px;line-height:1}
.bcrumb-tag .rm:hover{color:var(--red)}

/* Tree */
.tree-section{border-bottom:1px solid rgba(26,45,74,.3)}
.tree-section-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);user-select:none;transition:background .15s}
.tree-section-header:hover{background:rgba(45,106,160,.1)}
.tree-section-header .arrow{font-size:10px;transition:transform .2s;color:var(--text-dim);width:12px;text-align:center}
.tree-section-header .arrow.open{transform:rotate(90deg)}
.tree-section-body{display:none}
.tree-section-body.open{display:block}
.tree-node{padding:4px 14px 4px 28px;cursor:pointer;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;user-select:none;transition:all .15s;border-left:2px solid transparent}
.tree-node:hover{background:rgba(45,106,160,.08);color:var(--text);border-left-color:var(--accent)}
.tree-node input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--accent2)}
.tree-node.level-2{padding-left:42px}
.tree-node.level-3{padding-left:56px;font-size:11px}
.tree-count{font-size:10px;color:var(--text-dim);margin-left:auto;background:rgba(0,0,0,.3);padding:1px 6px;border-radius:8px}
#filter-actions{padding:12px;display:flex;gap:8px;border-top:1px solid var(--border)}
#filter-actions button{flex:1;padding:7px;font-size:12px;border-radius:4px;cursor:pointer;transition:all .2s}
#filter-actions button:first-child{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
#filter-actions button:first-child:hover{background:var(--bg-card)}
#filter-actions button.primary{background:var(--accent);color:#fff;border:1px solid var(--accent2)}
#filter-actions button.primary:hover{box-shadow:var(--glow)}

/* Content */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#map-container{flex:1;position:relative;display:block}
#map-container.hidden{display:none}
#map{width:100%;height:100%}
#stats-container{flex:1;overflow:auto;display:none;padding:20px;background:var(--bg-dark)}
#stats-container.active{display:block}

/* List */
#list-wrap{flex:1;display:none;flex-direction:column;overflow:hidden;background:var(--bg-panel)}
#list-wrap.active{display:flex}
#list-toolbar{padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(0,0,0,.15)}
#list-toolbar select{padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:3px;background:var(--bg-card);color:var(--text);max-width:110px}
#list-toolbar button{font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer}
#list-table-wrap{flex:1;overflow:auto}
#list-table{width:100%;border-collapse:collapse;font-size:12px}
#list-table thead{position:sticky;top:0;z-index:10}
#list-table th{background:#0a1628;color:var(--accent2);padding:8px 6px;text-align:left;font-weight:600;white-space:nowrap;font-size:11px;border-bottom:2px solid var(--accent)}
#list-table td{padding:6px;border-bottom:1px solid rgba(26,45,74,.3);cursor:pointer;transition:background .15s}
#list-table tr:hover td{background:rgba(45,106,160,.08)}
#list-table tr.selected td{background:rgba(45,106,160,.15);border-left:2px solid var(--accent2)}
.status-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.5px}
.st-正常{background:rgba(0,200,83,.15);color:var(--green);border:1px solid rgba(0,200,83,.3)}
.st-损坏{background:rgba(255,82,82,.15);color:var(--red);border:1px solid rgba(255,82,82,.3)}
.st-废弃{background:rgba(84,110,122,.15);color:var(--gray);border:1px solid rgba(84,110,122,.3)}
.st-在建{background:rgba(255,145,0,.15);color:var(--orange);border:1px solid rgba(255,145,0,.3)}
.st-待维修{background:rgba(68,138,255,.15);color:var(--blue);border:1px solid rgba(68,138,255,.3)}
.row-actions{display:flex;gap:3px}
.row-actions button{font-size:10px;padding:2px 7px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);transition:all .15s}
.row-actions .act-detail:hover{color:var(--accent2);border-color:var(--accent2)}
.row-actions .act-edit:hover{color:var(--green);border-color:var(--green)}
.row-actions .act-del:hover{color:var(--red);border-color:var(--red)}

/* Pagination */
#pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
#pagination button{font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text);transition:all .15s}
#pagination button:hover:not(:disabled){background:var(--accent);color:#fff;border-color:var(--accent)}
#pagination button:disabled{opacity:.3;cursor:default}
#pagination .page-info{font-size:11px;color:var(--text-dim);min-width:80px;text-align:center}

/* Detail Modal */
#detail-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center}
#detail-overlay.show{display:flex}
#detail-modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 48px rgba(0,0,0,.5);width:720px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
#detail-modal-header{background:linear-gradient(90deg,var(--accent),#1a4a7a);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
#detail-modal-header h3{font-size:16px;color:#fff}
#detail-modal-close{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:20px;transition:color .2s}
#detail-modal-close:hover{color:#fff}
#detail-modal-body{flex:1;overflow-y:auto;padding:20px}
.detail-top{display:flex;gap:20px;margin-bottom:20px}
.detail-img{width:200px;height:160px;border-radius:6px;object-fit:cover;background:var(--bg-card);flex-shrink:0;border:1px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:12px;flex:1}
.detail-item{display:flex;padding:4px 0;border-bottom:1px solid rgba(26,45,74,.3)}
.detail-item .l{color:var(--text-dim);width:80px;flex-shrink:0}
.detail-item .v{color:var(--text)}
.detail-section{margin-top:16px}
.detail-section h4{font-size:13px;color:var(--accent2);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--accent)}
#detail-modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
#detail-modal-footer button{padding:5px 14px;font-size:11px;border-radius:4px;cursor:pointer;transition:all .2s}

/* Form Modal */
#form-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:3000;display:none;align-items:center;justify-content:center}
#form-overlay.show{display:flex}
#form-modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 48px rgba(0,0,0,.5);width:700px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
#form-modal h3{padding:14px 20px;background:var(--bg-card);font-size:15px;border-bottom:1px solid var(--border);color:var(--text)}
#form-body{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.form-group{display:flex;flex-direction:column}
.form-group label{font-size:11px;color:var(--text-dim);margin-bottom:3px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text);font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent2)}
.form-group textarea{resize:vertical;min-height:50px}
.form-group.full{grid-column:1/-1}
.form-coord{display:flex;gap:6px;align-items:center}
.form-coord input{flex:1}
.form-coord button{padding:4px 8px;font-size:11px;white-space:nowrap;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg-card);color:var(--accent2)}
#form-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
#form-footer .btn-save{background:var(--accent);color:#fff;border:1px solid var(--accent2);padding:6px 20px;font-size:13px;border-radius:4px;cursor:pointer}
#form-footer .btn-cancel{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 20px;font-size:13px;border-radius:4px;cursor:pointer}

/* Context Menu */
#ctx-menu{position:fixed;z-index:4000;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.4);display:none;min-width:140px;overflow:hidden}
#ctx-menu .ctx-item{padding:8px 16px;font-size:12px;cursor:pointer;transition:background .15s;color:var(--text);display:flex;align-items:center;gap:8px}
#ctx-menu .ctx-item:hover{background:rgba(45,106,160,.15);color:var(--accent2)}

/* Pick indicator */
#pick-indicator{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:1000;display:none;box-shadow:var(--glow)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;transition:all .2s}
.stat-card:hover{border-color:var(--accent);box-shadow:var(--glow)}
.stat-card h4{font-size:13px;color:var(--text-dim);margin-bottom:12px}
.stat-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stat-bar-label{font-size:11px;color:var(--text-dim);width:54px;text-align:right;flex-shrink:0}
.stat-bar-track{flex:1;height:18px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;color:#fff}
.stat-num-card{text-align:center;padding:10px}
.stat-num-card .num{font-size:28px;font-weight:700;color:var(--accent2)}
.stat-num-card .lbl{font-size:11px;color:var(--text-dim);margin-top:4px}

/* Heatmap canvas */
#heatmap-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:500}

/* Category Markers */
.cat-marker{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid rgba(255,255,255,.3);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* Leaflet dark overrides */
.leaflet-container{background:var(--bg-dark)}
.leaflet-control-zoom a{background:var(--bg-card)!important;color:var(--text)!important;border-color:var(--border)!important}

/* Map legend */
.map-legend{background:rgba(13,26,45,.92);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:11px;color:var(--text);line-height:1.8;backdrop-filter:blur(8px)}
.map-legend h4{margin:0 0 6px;font-size:12px;color:var(--accent2)}
.map-legend-item{display:flex;align-items:center;gap:6px}
.map-legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>城市部件数据管理平台</h1>
    <div id="header-right">
      <span id="auth-user" style="display:none"><span class="user-name" id="auth-name"></span><span class="role-tag" id="auth-role"></span></span>
      <button id="btn-admin" class="btn-secondary" onclick="window.location.href='/admin.html'" title="系统管理" style="display:none">⚙️ 管理</button>
      <span id="result-count">共 0 条</span>
      <button id="btn-add" onclick="openAddForm()">＋ 新增部件</button>
      <div class="view-toggle">
        <button class="view-btn active" data-view="map" onclick="switchView('map')">🗺️ 地图</button>
        <button class="view-btn" data-view="list" onclick="switchView('list')">📋 列表</button>
        <button class="view-btn" data-view="stats" onclick="switchView('stats')">📊 统计</button>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="filter-panel">
      <h3>🔍 筛选条件</h3>
      <div id="search-box"><input id="search-input" type="text" placeholder="输入部件名称、编码、地址…" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn-secondary" style="margin-top:6px;width:100%" onclick="doSearch()">🔍 搜索</button></div>
      <div id="breadcrumb"></div>
      <div id="tree-filters"></div>
      <div id="filter-actions">
        <button onclick="resetFilters()">🔄 重置</button>
        <button class="primary" onclick="applyFilters()">✅ 应用</button>
      </div>
    </div>
    <div id="content">
      <div id="map-container"><div id="map"></div><div id="pick-indicator">📍 请在地图上点击获取坐标</div></div>
      <div id="list-wrap">
        <div id="list-toolbar">
          <select id="tf-major" onchange="onTFMajor()"><option value="">全部大类</option></select>
          <select id="tf-minor" onchange="onTFMinor()"><option value="">全部小类</option></select>
          <select id="tf-detail"><option value="">全部细类</option></select>
          <select id="tf-district" onchange="onTFDistrict()"><option value="">全部区县</option></select>
          <select id="tf-street"><option value="">全部街道</option></select>
          <button class="btn-secondary" onclick="applyToolFilters()">🔍 筛选</button>
          <button class="btn-secondary" onclick="resetToolFilters()">重置</button>
          <span style="flex:1"></span>
          <button class="btn-secondary" onclick="exportCSV()">📥 导出CSV</button>
          <button class="btn-secondary" style="color:var(--red);border-color:var(--red)" onclick="batchDelete()" disabled id="btn-batch-del">🗑 批量删除</button>
        </div>
        <div id="list-table-wrap">
          <table id="list-table"><thead><tr>
            <th style="width:30px"><input type="checkbox" id="select-all" onchange="toggleSelectAll()"></th>
            <th>序号</th><th>普查编码</th><th>部件名称</th><th>大类</th><th>小类</th><th>细类</th><th>区县</th><th>街道</th><th>状态</th><th>部门</th><th>业务系统</th><th style="width:120px">操作</th>
          </tr></thead><tbody id="list-body"></tbody></table>
        </div>
        <div id="pagination"></div>
      </div>
      <div id="stats-container"></div>
    </div>
  </div>
</div>
<div id="detail-overlay" onclick="if(event.target===this)closeDetail()">
  <div id="detail-modal"><div id="detail-modal-header"><h3 id="detail-modal-title">-</h3><button id="detail-modal-close" onclick="closeDetail()">✕</button></div>
  <div id="detail-modal-body"></div><div id="detail-modal-footer"><button class="btn-secondary" onclick="editCurrent()">✏️ 编辑</button><button class="btn-secondary" style="color:var(--red);border-color:var(--red)" onclick="deleteCurrent()">🗑 删除</button><button class="btn-secondary" onclick="closeDetail()">关闭</button></div></div>
</div>
<div id="form-overlay" onclick="if(event.target===this)closeForm()">
  <div id="form-modal"><h3 id="form-title">编辑部件</h3><div id="form-body"></div><div id="form-footer"><button class="btn-save" onclick="saveForm()">💾 保存</button><button class="btn-cancel" onclick="closeForm()">取消</button></div></div>
</div>
<div id="ctx-menu"></div>
<script>
// Auth check
(async function(){
  var token = localStorage.getItem('token');
  if (!token) { window.location.href = '/login.html'; return; }
  try {
    var resp = await fetch('/api/auth/profile', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!resp.ok) { localStorage.removeItem('token'); window.location.href = '/login.html'; return; }
    var data = await resp.json();
    if (data.code !== 200) { localStorage.removeItem('token'); window.location.href = '/login.html'; return; }
    var user = data.data;
    document.getElementById('auth-user').style.display = '';
    document.getElementById('auth-name').textContent = '👤 ' + user.realName;
    document.getElementById('auth-role').textContent = user.roleName;
    if (user.roleType === 1 || user.roleType === 2) {
      document.getElementById('btn-admin').style.display = '';
    }
    window.__permissions = user.permissions || [];
    window.__user = user;
  } catch(e) { localStorage.removeItem('token'); window.location.href = '/login.html'; }
})();
</script>
<script src="libs/leaflet.js"></script>
<script src="libs/leaflet-heat.js"></script>
<script src="app.js"></script>
</body>
</html>
