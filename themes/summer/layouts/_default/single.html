{{ define "main" }}
<article class="single-post">
  {{ $current := . }}
  <a href="{{ .CurrentSection.Permalink }}" class="back-link">← 返回{{ .CurrentSection.Title }}</a>
  <header class="post-header">
    <h1 class="post-title-main">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <span class="post-section-tag">{{ .Section }}</span>
    </div>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <footer class="post-footer">
    {{ with .Params.tags }}
    <div class="post-tags">
      {{ range . }}
      <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}" class="tag">#{{ . }}</a>
      {{ end }}
    </div>
    {{ end }}
  </footer>
</article>
{{ end }}
