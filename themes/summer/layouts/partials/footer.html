<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-line">
      © {{ if ne site.Params.since now.Year }}{{ site.Params.since }}–{{ end }}{{ now.Format "2006" }} {{ site.Title }}
      <span class="footer-dot">·</span> {{ site.Params.description }}
    </p>
    <p class="footer-links">
      <a href="{{ `index.xml` | relURL }}">RSS 订阅</a>
      <span class="footer-dot">·</span>
      <a href="{{ `sitemap.xml` | relURL }}">站点地图</a>
      <span class="footer-dot">·</span>
      <a href="#top">回到顶部 ↑</a>
    </p>
  </div>
</footer>
