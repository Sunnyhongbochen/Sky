<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登录 · 夏天的小站</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --primary: #1B6E9C;
    --primary-hover: #17618A;
    --page-bg: #F5F9FC;
    --card-bg: #FFFFFF;
    --text: #22313F;
    --text-light: #566B80;
    --border: #DDE8F2;
    --danger: #C0392B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #58B4DE;
      --primary-hover: #7FC9EA;
      --page-bg: #0F1720;
      --card-bg: #16222E;
      --text: #DCE7F2;
      --text-light: #9FB3C8;
      --border: #24384A;
      --danger: #FF8A7A;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1B6E9C 0%, #2E8FBF 60%, #3E93BC 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    color: var(--text);
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 2.6rem 2.2rem;
    width: 380px;
    max-width: 100%;
    box-shadow: 0 20px 60px rgba(10, 40, 60, .22);
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 1rem;
    border-radius: 14px;
    background: linear-gradient(135deg, #1B6E9C, #3E93BC);
    color: #fff;
    font-size: 1.7rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: .02em; }
  .sub { font-size: .85rem; color: var(--text-light); margin: .4rem 0 1.8rem; }
  .field {
    width: 100%;
    padding: .8rem 1rem;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    background: transparent;
    color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  .field::placeholder { color: var(--text-light); opacity: .8; letter-spacing: 0; }
  .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27, 110, 156, .15); }
  button {
    width: 100%;
    margin-top: .9rem;
    padding: .8rem;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:hover { background: var(--primary-hover); }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .error {
    color: var(--danger);
    font-size: .82rem;
    margin-top: .85rem;
    min-height: 1.2em;
  }
  .foot { font-size: .72rem; color: var(--text-light); margin-top: 1.6rem; }
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">夏</div>
  <h1>夏天的小站</h1>
  <p class="sub">这是一个私人站点，请输入访问密码</p>
  <form id="form" novalidate>
    <label for="pwd" class="sr-only" style="position:absolute;left:-9999px">访问密码</label>
    <input class="field" type="password" id="pwd" name="password" placeholder="访问密码"
           autocomplete="current-password" autofocus required>
    <button id="btn" type="submit">进 入</button>
  </form>
  <p class="error" id="err" role="alert" aria-live="polite"></p>
  <p class="foot">仅限本人及好友访问 · 密码由站点主维护</p>
</main>

<script>
(function () {
  const form = document.getElementById('form');
  const input = document.getElementById('pwd');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');

  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';

  function fail(msg) {
    err.textContent = msg;
    input.value = '';
    input.focus();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const password = input.value.trim();
    if (!password) return;

    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '验证中…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ password: password, next: next })
      });
      const data = await res.json().catch(function () { return {}; });

      if (res.ok && data.success) {
        btn.textContent = '正在进入…';
        location.replace(data.next || '/');
        return;
      }
      fail(data.message === '密码错误' ? '密码不正确，请重试' : (data.message || '验证失败，请重试'));
    } catch (e2) {
      fail('网络异常，请检查网络后重试');
    } finally {
      btn.disabled = false;
      if (btn.textContent === '验证中…') btn.textContent = '进 入';
    }
  });
})();
</script>
</body>
</html>
