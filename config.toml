baseURL = "https://summer-website.pages.dev/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "夏天的小站"
theme = "summer"

[params]
  author = "胡夏天"
  description = "记录思考，沉淀成长"
  keywords = ["博客", "笔记", "成长"]
  DateFormat = "2006-01-02 15:04"

  [params.profileMode]
    enabled = true
    title = "夏天的小站"
    subtitle = "记录思考，沉淀成长"
    imageUrl = ""
    imageTitle = ""
    imageWidth = 120
    imageHeight = 120

[[menu.main]]
  identifier = "posts"
  name = "偶得碎语"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "notes"
  name = "知学札记"
  url = "/notes/"
  weight = 2

[[menu.main]]
  identifier = "moments"
  name = "时光印记"
  url = "/moments/"
  weight = 3

[[menu.main]]
  identifier = "ai-growth"
  name = "AI成长"
  url = "/ai-growth/"
  weight = 4

[[menu.main]]
  identifier = "links"
  name = "链接"
  url = "/links/"
  weight = 5

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "github-dark"
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
