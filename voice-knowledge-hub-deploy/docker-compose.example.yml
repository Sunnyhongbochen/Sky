services:
  voice-knowledge-hub:
    build: .
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      DATA_DIR: /app/data
      PYTHON_BIN: /app/.venv/bin/python
      WHISPER_MODEL: small
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_TIMEOUT_MS: 300000
    volumes:
      - ./data:/app/data

